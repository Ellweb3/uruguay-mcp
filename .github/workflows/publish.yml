name: Publish to PyPI

# Publishes to PyPI on every pushed tag like v0.1.1, using PyPI Trusted
# Publishing (OpenID Connect) — no API tokens stored in GitHub.
# `workflow_dispatch` allows a manual run (e.g. to re-publish or smoke-test
# the pipeline); `skip-existing` keeps that idempotent.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest -q

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Verify tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$tag  pyproject=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $ver"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The trusted publisher on PyPI is bound to this environment name.
    environment:
      name: pypi
      url: https://pypi.org/project/uruguay-mcp/
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
