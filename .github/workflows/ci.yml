name: CI

# Runs the full lint + type-check + test gate on every push and pull request
# to main. Tag pushes are handled by publish.yml (which re-runs the same gate
# before publishing), so they are excluded here to avoid duplicate runs.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pyright
        run: uv run pyright
      - name: Pytest (offline, coverage gate)
        run: uv run pytest -q -m "not integration"
