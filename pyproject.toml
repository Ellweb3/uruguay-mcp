[project]
name = "uruguay-mcp"
version = "0.3.0"
description = "MCP server for Uruguay's open government data (national catalog, BCU, INE, Montevideo, gub.uy)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "uruguay-mcp contributors" }]
keywords = ["mcp", "uruguay", "open-data", "ckan", "bcu", "ine", "montevideo"]

dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "aiocache>=0.12",
    "zeep>=4.2",          # SOAP client for BCU web services
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",        # httpx mocking
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
uruguay-mcp = "uruguay_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uruguay_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/uruguay_mcp --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: hits live government APIs (deselect with -m 'not integration')"]

[tool.coverage.run]
branch = true
source = ["src/uruguay_mcp"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
